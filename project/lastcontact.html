<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styleslarge.css">
    <link rel="stylesheet" href="lastcontact.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <div class="logo">
            <a href="lastindex.html">
                <img src="images/logo.webp" alt="Logo do Restaurante">
            </a>
        </div>
        <button class="hamburger-button" id="hamburger-button">
            ☰
        </button>
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="lastindex.html">Home</a></li>
                <li><a href="lastevents.html">Events</a></li>
                <li><a href="lastcontact.html">Contact</a></li>
            </ul>
        </nav>
    </header>


    <main>
        <section class="contact-form">
            <h1>Contact Us</h1>
            <form>
                <input type="text" placeholder="Name">
                <input type="email" placeholder="Email">
                <textarea placeholder="Message"></textarea>
                <button type="submit" class="res-button">Send</button>
            </form>
        </section>
        <div class="address">
            <p>Urbanização 30 de Junho, 51 A - Phone: +351 964 865 883</p>
        </div>

        <section class="map">
            <div class="map-image">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3180.9692013664408!2d-8.676552223584395!3d37.12964774905845!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd1b31f255fcbfe1%3A0xb88d256d096d937a!2sRestaurante%2030%20de%20junho!5e0!3m2!1spt-BR!2scz!4v1733149684304!5m2!1spt-BR!2scz"
                    width="100%" height="500" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
    </main>

    <button class="sticky-button">Sticky Button</button>

    <footer>
        <div class="footer-links">
            <a href="https://www.facebook.com" target="_blank">
                <img src="images/image.webp" alt="Facebook">
            </a>
            <a href="https://www.instagram.com" target="_blank">
                <img src="images/instagram.webp" alt="Instagram">
            </a>
        </div>
    </footer>

</body>

</html>
